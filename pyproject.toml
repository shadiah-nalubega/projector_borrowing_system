[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "projector-borrowing"
version = "0.1.0"
description = "Projector borrowing system using DDD, TDD and Clean Architecture"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
]

[project.scripts]
borrow-projector = "projector_borrowing.interface.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
