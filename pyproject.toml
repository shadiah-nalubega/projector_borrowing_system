[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "projector-borrowing"
version = "0.1.0"
description = "Projector borrowing system: DDD, TDD and Clean Architecture coursework"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
borrow-projector = "projector_borrowing.interface.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
